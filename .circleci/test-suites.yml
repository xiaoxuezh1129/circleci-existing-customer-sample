---
name: ci tests
discover: npx vitest list --filesOnly
run: npx vitest run --reporter=junit --outputFile="<< outputs.junit >>" --bail 0 << test.atoms >>
analysis: |
  CIRCLECI_COVERAGE=<< outputs.circleci-coverage >> \
  npx vitest run --silent \
      --bail 0 \
      << test.atoms >>
options:
  store-test-results: true
  test-impact-analysis: true
  dynamic-test-splitting: true